[project]
name = "badminton-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "os-pahariaryan", email = "aryanpahari@omnisavant.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.40",
    "huggingface-hub>=1.28.0",
    "lap>=0.5.12",
    "opencv-python>=5.0.0.93",
    "pillow>=11.0.0",
    "pycocotools>=2.0.10",
    "pydantic-settings>=2.10.0",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.21.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "transformers>=4.50.0",
    "transnetv2-pytorch==1.0.5",
    "ultralytics>=8.4.138",
]

[project.scripts]
badminton-analysis = "badminton_analysis:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
